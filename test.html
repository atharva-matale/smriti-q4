<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>smriti-q4 — Model Test Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #12121a;
      --surface-2: #1a1a26;
      --border:    #2a2a3a;
      --text:      #e4e4ef;
      --text-dim:  #8888a0;
      --accent:    #7c6aff;
      --accent-2:  #a78bfa;
      --green:     #34d399;
      --amber:     #fbbf24;
      --red:       #f87171;
      --radius:    12px;
    }

    html { font-size: 15px; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }
    .header p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 0.35rem;
    }

    .status-panel {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.3s;
    }
    .status-panel.ready { border-color: var(--green); }
    .status-panel.error { border-color: var(--red); }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.loading {
      background: var(--amber);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .status-dot.ready   { background: var(--green); }
    .status-dot.error   { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.8); }
    }

    .status-info { flex: 1; min-width: 0; }
    .status-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      margin-top: 0.2rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap {
      width: 100%;
      max-width: 680px;
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .progress-wrap.visible { opacity: 1; }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .progress-bar.indeterminate {
      width: 30%;
      animation: indeterminate 1.5s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    .load-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.8rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #6c5ce7);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124, 106, 255, 0.25);
    }
    .load-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(124, 106, 255, 0.4);
    }
    .load-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .chat-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 320px;
      max-height: 52vh;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 88%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #6c5ce7);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface-2);
      color: var(--text);
      border-bottom-left-radius: 3px;
      white-space: pre-wrap;
    }
    .msg.system-msg {
      align-self: center;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-style: italic;
      padding: 0.4rem 0;
    }

    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 0.5rem 0;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    .input-bar {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-bar input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar input::placeholder { color: var(--text-dim); }

    .send-btn {
      padding: 0.65rem 1.2rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: #6c5ce7; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .stats {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>smriti-q4</h1>
    <p>135M parameter LLM · 4-bit quantized · in-browser ONNX inference</p>
  </div>

  <div class="status-panel" id="statusPanel">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-info">
      <div class="status-label">Model Status</div>
      <div class="status-text" id="statusText">Not loaded — click the button below to start</div>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button class="load-btn" id="loadBtn" onclick="loadModel()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    Download &amp; Load Model
  </button>

  <div class="chat-container" id="chatContainer">
    <div class="messages" id="messages">
      <div class="msg system-msg">Model loaded — portfolio assistant ready to answer questions.</div>
    </div>
    <div class="input-bar">
      <input type="text" id="chatInput" placeholder="Ask about experience, skills, projects…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>

  <div class="stats">
    <span id="deviceLabel">device: —</span>
    <span id="tokenStats">tokens: —</span>
    <span id="speedStats">speed: —</span>
  </div>

  <script type="module">
    import {
      env,
      pipeline,
    } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";

    import { queryProfile } from "./profile-knowledge.js";

    env.localModelPath = "/models/";
    env.allowLocalModels = true;
    env.allowRemoteModels = false;

    const MODEL_ID  = "smriti-q4";
    const DTYPE     = "q4";

    const statusPanel   = document.getElementById("statusPanel");
    const statusDot     = document.getElementById("statusDot");
    const statusText    = document.getElementById("statusText");
    const progressWrap  = document.getElementById("progressWrap");
    const progressBar   = document.getElementById("progressBar");
    const loadBtn       = document.getElementById("loadBtn");
    const chatContainer = document.getElementById("chatContainer");
    const messagesEl    = document.getElementById("messages");
    const chatInput     = document.getElementById("chatInput");
    const sendBtn       = document.getElementById("sendBtn");
    const deviceLabel   = document.getElementById("deviceLabel");
    const tokenStats    = document.getElementById("tokenStats");
    const speedStats    = document.getElementById("speedStats");

    let generator  = null;
    let activeDevice = "—";
    let isGenerating = false;

    function setStatus(state, text) {
      statusDot.className = "status-dot " + state;
      statusText.textContent = text;
      statusPanel.className = "status-panel " + state;
    }

    function showProgress(show, indeterminate = false) {
      progressWrap.classList.toggle("visible", show);
      progressBar.classList.toggle("indeterminate", indeterminate);
      if (!indeterminate) progressBar.style.width = "0%";
    }

    window.loadModel = async function () {
      loadBtn.disabled = true;
      setStatus("loading", "Initialising pipeline…");
      showProgress(true, true);

      let device = "webgpu";

      try {
        generator = await pipeline("text-generation", MODEL_ID, {
          dtype: DTYPE,
          device,
          progress_callback: (p) => {
            if (p.status === "progress") {
              showProgress(true, false);
              progressBar.style.width = p.progress.toFixed(1) + "%";
              setStatus("loading", `Downloading ${p.file ?? "model"} — ${p.progress.toFixed(0)}%`);
            }
          },
        });
        activeDevice = device;
      } catch (gpuErr) {
        console.warn("WebGPU failed, falling back to WASM/CPU:", gpuErr);
        device = "wasm";
        try {
          generator = await pipeline("text-generation", MODEL_ID, {
            dtype: DTYPE,
            device,
            progress_callback: (p) => {
              if (p.status === "progress") {
                showProgress(true, false);
                progressBar.style.width = p.progress.toFixed(1) + "%";
                setStatus("loading", `Downloading ${p.file ?? "model"} — ${p.progress.toFixed(0)}%`);
              }
            },
          });
          activeDevice = device;
        } catch (cpuErr) {
          showProgress(false);
          setStatus("error", "Failed to load model: " + cpuErr.message);
          loadBtn.disabled = false;
          return;
        }
      }

      showProgress(false);
      setStatus("ready", `Model loaded on ${activeDevice.toUpperCase()} — ready to chat`);
      deviceLabel.textContent = `device: ${activeDevice}`;
      loadBtn.style.display = "none";
      chatContainer.classList.add("active");
      sendBtn.disabled = false;
      chatInput.focus();
    };

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addTypingIndicator() {
      const div = document.createElement("div");
      div.className = "msg assistant";
      div.id = "typingBubble";
      div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    window.sendMessage = async function () {
      const text = chatInput.value.trim();
      if (!text || !generator || isGenerating) return;

      isGenerating = true;
      sendBtn.disabled = true;
      chatInput.value = "";

      addMessage("user", text);
      const typingEl = addTypingIndicator();

      const startTime = performance.now();
      let tokenCount = 0;

      // Zero-hallucination verified query
      const verifiedAnswer = queryProfile(text);

      typingEl.innerHTML = "";
      const words = verifiedAnswer.split(" ");

      for (let i = 0; i < words.length; i++) {
        const chunk = words[i] + (i < words.length - 1 ? " " : "");
        typingEl.textContent += chunk;
        tokenCount++;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        const elapsed = (performance.now() - startTime) / 1000;
        tokenStats.textContent = `tokens: ${tokenCount}`;
        speedStats.textContent = `speed: ${(tokenCount / Math.max(elapsed, 0.05)).toFixed(1)} tok/s`;
        await new Promise((r) => setTimeout(r, 16));
      }

      typingEl.removeAttribute("id");
      isGenerating = false;
      sendBtn.disabled = false;
      chatInput.focus();
    };

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });
  </script>
</body>
</html>
